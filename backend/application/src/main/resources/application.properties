spring.application.name=resilient-city-planning-simulator
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/resilientcity}
spring.datasource.username=${DB_USERNAME:resilientcity}
spring.datasource.password=${DB_PASSWORD:resilientcity}
spring.datasource.hikari.connection-timeout=5000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
