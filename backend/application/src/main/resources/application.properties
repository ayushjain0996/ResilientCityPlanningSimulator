spring.application.name=resilient-city-planning-simulator
server.port=8080
resilientcity.queue.runs=runs
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.listener.simple.prefetch=1
spring.datasource.url=jdbc:postgresql://localhost:5432/resilientcity
spring.datasource.username=resilientcity
spring.datasource.password=resilientcity
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:ie/tcd/resilientcity/adapter/outbound/persistence/schema.sql
spring.sql.init.data-locations=classpath:ie/tcd/resilientcity/adapter/outbound/persistence/data.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
